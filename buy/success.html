        // JSONbin configuration
        const JSONBIN_API_KEY = '$2a$10$YourJsonBinApiKey';
        const JSONBIN_BIN_ID = 'your-bin-id';
        const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';

        async function saveToJsonBin(trackId, txHash) {
            try {
                const response = await fetch(`${JSONBIN_URL}/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify({
                        trackId: trackId,
                        txHash: txHash,
                        timestamp: Date.now()
                    })
                });
                return response.ok;
            } catch (error) {
                console.error('Error saving to JSONbin:', error);
                return false;
            }
        }

        async function checkJsonBin(trackId, txHash) {
            try {
                const response = await fetch(`${JSONBIN_URL}/${JSONBIN_BIN_ID}`, {
                    headers: {
                        'X-Master-Key': JSONBIN_API_KEY
                    }
                });
                const data = await response.json();
                const records = data.record || {};
                return records.trackId === trackId || records.txHash === txHash;
            } catch (error) {
                console.error('Error checking JSONbin:', error);
                return false;
            }
        }

        function downloadPage() {
            // Remove the download button before saving
            const downloadBtn = document.getElementById('downloadPageBtn');
            downloadBtn.style.display = 'none';
            
            const pageContent = document.documentElement.outerHTML;
            const blob = new Blob([pageContent], { type: 'text/html' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'soul_payment_success.html';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            
            // Show the button again
            downloadBtn.style.display = 'flex';
        }

        // Initialize Three.js background
        function initBackground() {
            const container = document.getElementById('canvas-container');
            if (!container || typeof THREE === 'undefined') return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const SEPARATION = 40;
            const AMOUNTX = 60;
            const AMOUNTY = 60;

            const geometry = new THREE.BufferGeometry();
            const vertices = [];

            for (let ix = 0; ix < AMOUNTX; ix++) {
                for (let iy = 0; iy < AMOUNTY; iy++) {
                    const x = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2);
                    const z = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2);
                    const y = 0;
                    vertices.push(x, y, z);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

            const material = new THREE.PointsMaterial({
                color: 0x8b5cf6,
                size: 3,
                transparent: true,
                opacity: 0.8
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            camera.position.y = 300;
            camera.position.z = 800;
            camera.lookAt(0, 0, 0);

            let count = 0;

            const animate = () => {
                requestAnimationFrame(animate);

                const positions = particles.geometry.attributes.position.array;
                let i = 0;

                for (let ix = 0; ix < AMOUNTX; ix++) {
                    for (let iy = 0; iy < AMOUNTY; iy++) {
                        const value = (Math.sin((ix + count) * 0.3) * 50) + (Math.sin((iy + count) * 0.5) * 50);
                        positions[i + 1] = value;
                        i += 3;
                    }
                }

                particles.geometry.attributes.position.needsUpdate = true;
                particles.rotation.y += 0.002;
                count += 0.1;

                renderer.render(scene, camera);
            };

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', function() {
            initBackground();
