<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPayGate - Choose Your Region</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1c2c 0%, #0f1118 100%);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .selection-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
            background: radial-gradient(circle at center, rgba(41, 41, 77, 0.2) 0%, rgba(15, 17, 24, 0.1) 100%);
        }

        .selection-title {
            margin-bottom: 2rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .selection-title h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #a8b2d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .selection-cards {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .selection-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 320px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .selection-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transition: 0.5s;
        }

        .selection-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3),
                       0 0 30px rgba(107, 33, 168, 0.2);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .selection-card:hover::before {
            left: 100%;
        }

        .selection-card i {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .selection-card:hover i {
            transform: scale(1.1) rotate(5deg);
            color: #a8b2d1;
        }

        .selection-card h3 {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .selection-card p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .selection-btn {
            background: linear-gradient(45deg, #6b21a8, #3730a3);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(107, 33, 168, 0.3);
        }

        .selection-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        .selection-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(107, 33, 168, 0.4);
            opacity: 0.95;
        }

        .selection-btn:hover::before {
            left: 100%;
        }

        /* Enhanced Snowfall styles */
        .snowflake {
            position: fixed;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 0;
            box-shadow: 0 0 5px #fff;
        }

        .snowflake::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            filter: blur(1px);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .snowfall-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Add glowing effect to some snowflakes */
        .snowflake.glow {
            background: radial-gradient(circle at center, #fff, rgba(255,255,255,0.5));
            box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff;
        }
    </style>
</head>
<body>
    <div class="snowfall-container main-snow"></div>
    <div class="snowfall-container section-snow"></div>
    <div class="snowfall-container footer-snow"></div>
    
    <div class="main-container">
        <div class="selection-container">
            <div class="selection-title">
                <h1>Choose Your Region</h1>
                <p>Select your preferred payment currency</p>
            </div>
            
            <div class="selection-cards">
                <div class="selection-card">
                    <i class="fas fa-rupee-sign"></i>
                    <h3>Indian Users</h3>
                    <p>Pay in Indian Rupees (INR)</p>
                    <a href="pricing-inr.html" class="selection-btn">Continue with INR</a>
                </div>
                
                <div class="selection-card">
                    <i class="fas fa-dollar-sign"></i>
                    <h3>Foreign Users</h3>
                    <p>Pay in US Dollars (USD)</p>
                    <a href="pricing-usd.html" class="selection-btn">Continue with USD</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Enhanced snowfall initialization
        document.addEventListener('DOMContentLoaded', function() {
            const containers = document.querySelectorAll('.snowfall-container');
            
            containers.forEach(container => {
                // Create more snowflakes for each container
                for (let i = 0; i < 50; i++) {
                    const snowflake = document.createElement('div');
                    snowflake.classList.add('snowflake');
                    
                    // Random properties
                    const size = Math.random() * 4 + 1;
                    const left = Math.random() * 100;
                    const animationDuration = Math.random() * 20 + 10;
                    const delay = Math.random() * 10;
                    const opacity = Math.random() * 0.5 + 0.5;
                    
                    // Add glowing effect to some snowflakes
                    if (Math.random() > 0.8) {
                        snowflake.classList.add('glow');
                    }
                    
                    // Set styles
                    snowflake.style.width = `${size}px`;
                    snowflake.style.height = `${size}px`;
                    snowflake.style.left = `${left}%`;
                    snowflake.style.opacity = opacity;
                    snowflake.style.animationDuration = `${animationDuration}s`;
                    snowflake.style.animationDelay = `${delay}s`;
                    
                    container.appendChild(snowflake);
                }
            });
        });
    </script>
</body>
</html>
