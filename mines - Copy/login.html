<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soul Login</title>
    <meta property="og:title" content="Mines Predictor">
    <meta property="og:url" content="https://soulpredictor.xyz">
    <meta property="og:type" content="website">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --primary-color: #00e701;
            --primary-hover: #1fff20;
            --background-color: #0b2331;
            --secondary-background: rgba(26, 44, 56, 0.8);
            --text-color: #ffffff;
            --input-background: rgba(21, 33, 46, 0.6);
            --input-border: #2f4553;
            --error-color: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background-color: var(--secondary-background);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-wrap {
            position: relative;
        }

        label {
            position: absolute;
            left: 1rem;
            top: 1rem;
            color: #b1bad3;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 1rem;
            background-color: var(--input-background);
            border: 2px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 231, 1, 0.2);
        }

        input:focus + label,
        input:not(:placeholder-shown) + label {
            top: -0.5rem;
            left: 0.5rem;
            font-size: 0.8rem;
            background-color: var(--secondary-background);
            padding: 0 0.5rem;
            color: var(--primary-color);
        }

        button {
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 1.125rem;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            background: #ff4757 !important;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
            pointer-events: none;
        }

        button:hover {
            background: #ff6b81 !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .loader {
            position: absolute;
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #fff;
            animation: spin 1s linear infinite;
        }

        button.loading .content {
            visibility: hidden;
        }

        button.loading .loader {
            display: block;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 150%; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Remove old loading animation styles */
        .dot {
            display: none !important;
        }

        .social {
            margin-top: 2rem;
            text-align: center;
        }

        .social h6 {
            font-size: 0.9rem;
            color: #b1bad3;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }

        .social h6::before,
        .social h6::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 1px;
            background-color: #b1bad3;
        }

        .social h6::before {
            left: -40px;
        }

        .social h6::after {
            right: -40px;
        }

        .logos {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .logo {
            width: 2.5rem;
            height: 2.5rem;
            fill: #436f87;
            transition: all 0.3s ease;
        }

        .logo:hover {
            fill: var(--primary-color);
            transform: translateY(-3px);
        }

        .error {
            color: var(--error-color);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translatey(0px); }
            50% { transform: translatey(-20px); }
            100% { transform: translatey(0px); }
        }
    </style>
</head>
<body>
    <div class="background" id="background"></div>
    <div class="container">
        <h1 class="floating">Soul Mines Predictor</h1>
        <form id="login-form">
            <div class="input-wrap">
                <input type="password" id="activation-key" placeholder=" " required>
                <label for="activation-key">Activation Key</label>
                <div class="error"></div>
            </div>
            <button type="submit">
                <div class="content">Login</div>
                <div class="loader"></div>
            </button>
        </form>
        <div class="social">
            <h6>Official Links</h6>
            <div class="logos">
                <a href="https://www.youtube.com/soulpredictor" target="_blank">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="logo">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </a>
                <a href="https://t.me/stakelibrarian" target="_blank">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="logo">
                        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
